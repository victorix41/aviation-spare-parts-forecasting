project:
  name: aviation-spare-parts-forecasting
  version: 0.2.0
  environment: development

paths:
  raw_data: data/raw
  cleaned_data: data/cleaned
  synthetic_data: data/synthetic
  processed_data: data/processed
  database: database/aviation_spares.duckdb
  forecasts: outputs/forecasts
  reports: outputs/reports
  exports: outputs/exports

data:
  as_of_date: 2026-08-04
  date_format: "%Y-%m-%d"
  currency: USD

forecasting:
  history_months: 36
  forecast_horizons:
    - 3
    - 6
    - 12
  minimum_observations: 6
  default_method: croston_sba

inventory:
  lead_time_default_days: 45
  service_level_default: 0.95
  safety_stock_months:
    critical: 4
    high: 3
    medium: 2
    low: 1

analytics:
  monthly_frequency: MS

  demand_history:
    start_date: 2023-08-01
    end_date: 2026-07-31

  abc_thresholds:
    class_a_cumulative_percent: 0.80
    class_b_cumulative_percent: 0.95

  xyz_thresholds:
    class_x_cv: 0.50
    class_y_cv: 1.00

  intermittent_demand:
    adi_threshold: 1.32
    cv_squared_threshold: 0.49

forecast_models:
  forecast_horizon_months: 12

  naive:
    enabled: true

  moving_average:
    enabled: true
    window: 3

  weighted_moving_average:
    enabled: true
    weights:
      - 0.20
      - 0.30
      - 0.50

  exponential_smoothing:
    enabled: true
    smoothing_level: 0.30

  croston_sba:
    enabled: true
    alpha: 0.10

  minimum_history_months: 6

model_selection:
  validation_months: 6
  minimum_training_months: 12

  primary_metric: wape

  metrics:
    - mae
    - rmse
    - wape
    - bias

  tie_break_order:
    - croston_sba
    - exponential_smoothing
    - weighted_moving_average
    - moving_average
    - naive

  zero_actual_policy: absolute_error

  final_forecast_horizon_months: 12

  output_tables:
    backtest_results: forecast_backtest_results
    selected_models: selected_forecast_models
    final_forecasts: final_part_forecasts

inventory_optimisation:
  days_per_month: 30.4375
  default_lead_time_days: 45
  minimum_lead_time_days: 1

  service_levels:
    critical: 0.99
    high: 0.97
    medium: 0.95
    low: 0.90
    unspecified: 0.95

  eoq:
    enabled: true
    ordering_cost_usd: 150.00
    annual_holding_rate: 0.25

  target_stock:
    planning_horizon_months: 12
    include_safety_stock: true

  risk_thresholds:
    critical_months_cover: 0.0
    high_months_cover: 1.5
    medium_months_cover: 3.0

  procurement_priority:
    critical: 1
    high: 2
    medium: 3
    low: 4

  governance:
    automatic_purchase_orders: false
    human_approval_required: true

  output_tables:
    optimisation_results: inventory_optimisation_results
    procurement_recommendations: procurement_recommendations
    risk_summary: inventory_risk_summary

agentic_ai:
  implementation_mode: deterministic_advisory

  governance:
    allow_database_writes: false
    allow_inventory_changes: false
    allow_purchase_order_creation: false
    allow_financial_approval: false
    require_human_approval: true
    require_evidence: true
    require_final_assurance: true

  confidence:
    high_forecast_confidence:
      - High
      - Medium
    acceptable_forecast_confidence:
      - High
      - Medium
      - Low

  thresholds:
    executive:
      critical_parts_trigger: 1
      high_risk_parts_trigger: 10
      procurement_value_trigger_usd: 500000

    procurement:
      urgent_priority_maximum: 2
      high_value_order_usd: 50000
      long_lead_time_days: 90

    finance:
      high_total_procurement_value_usd: 1000000
      high_single_part_value_usd: 100000
      low_confidence_value_review_usd: 25000

    engineering:
      criticality_levels:
        - Critical
        - High
      low_confidence_requires_review: true

    operations:
      immediate_stockout_months: 0.5
      near_term_stockout_months: 1.5

    quality:
      require_human_approval_for_all_orders: true
      flag_missing_evidence: true
      flag_low_confidence_orders: true

  output_tables:
    agent_recommendations: agent_recommendations
    role_advisory_summary: role_advisory_summary
    assurance_findings: agent_assurance_findings

dashboard:
  title: Aviation Spare Parts Demand Forecasting
  subtitle: Forecasting, Inventory Optimisation and Agentic AI Decision Support

  page:
    layout: wide
    sidebar_state: expanded

  display:
    currency: USD
    currency_decimals: 2
    quantity_decimals: 0
    maximum_table_rows: 100
    top_recommendations: 20

  refresh:
    cache_seconds: 60

  risk_order:
    - Critical
    - High
    - Medium
    - Low

  risk_colours:
    Critical: "#C00000"
    High: "#ED7D31"
    Medium: "#FFC000"
    Low: "#70AD47"

  readiness:
    critical_parts_red_threshold: 5
    critical_parts_amber_threshold: 1
    high_risk_parts_red_threshold: 30
    high_risk_parts_amber_threshold: 10
    procurement_exposure_red_usd: 1000000
    procurement_exposure_amber_usd: 500000

  drilldown:
    enabled: true
    maximum_parts: 100

  styling:
    compact_layout: true
    enlarge_kpi_values: true

  governance:
    read_only: true
    allow_purchase_order_creation: false
    allow_inventory_updates: false
    allow_financial_approval: false
    require_human_approval: true

  pipeline_monitoring:
    recent_run_limit: 10
    stale_after_hours: 24
    warning_duration_seconds: 30
    critical_duration_seconds: 60

    status_colours:
      Passed: "#70AD47"
      Failed: "#C00000"
      Running: "#5B9BD5"
      Unknown: "#A5A5A5"

  report_download:
    enabled: true
    require_successful_pipeline: true
    warn_when_stale: true
    stale_after_hours: 24
    download_label: Download Management Report
    generate_label: Generate Latest Management Report

reporting:
  management_report:
    enabled: true
    output_filename: aviation_spare_parts_management_report.xlsx
    maximum_detail_rows: 500
    include_pipeline_audit: true
    include_agent_advisories: true

    title: Aviation Spare Parts Demand Forecasting
    subtitle: Management Forecasting, Inventory and Agentic Advisory Report

    colours:
      primary: "1F4E78"
      secondary: "D9EAF7"
      critical: "C00000"
      high: "ED7D31"
      medium: "FFC000"
      low: "70AD47"
      header_text: "FFFFFF"

scheduling:
  enabled: true
  job_name: aviation_spare_parts_daily_job

  run_pipeline: true
  generate_management_report: true
  stop_report_when_pipeline_fails: true

  lock_file: outputs/reports/scheduled_job.lock
  latest_summary: outputs/reports/scheduled_job_summary.json
  log_directory: outputs/logs

  retention:
    maximum_log_files: 30

governance:
  allow_automatic_purchase_orders: false
  require_human_approval: true
  synthetic_data_must_be_labelled: true